name: Build furniture catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/catalog.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/catalog.mjs
      - name: Commit catalog to main and gh-pages
        run: |
          git config user.name "picalive-bot"; git config user.email "actions@users.noreply.github.com"
          git add catalog && git commit -m "Update furniture catalog" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
          git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages && git merge -X theirs --no-edit main && git push origin gh-pages
